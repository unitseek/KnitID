name: Bug report
description: Report a reproducible bug in KnitID
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do **not** use this form for security vulnerabilities — see SECURITY.md.
  - type: input
    id: knitid-version
    attributes:
      label: KnitID version
      placeholder: "0.3.0-SNAPSHOT / 1.0.0"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "21.0.x"
    validations:
      required: true
  - type: input
    id: boot-version
    attributes:
      label: Spring Boot version
      placeholder: "4.1.2 (leave empty for non-Spring usage)"
  - type: dropdown
    id: generator
    attributes:
      label: Generator / feature
      options:
        - UUIDv7
        - UUIDv8
        - ULID
        - KSID
        - BIZ
        - WorkerId assigner
        - Redis sequence
        - IdParser
        - Actuator / health / metrics
        - Spring Boot auto-configuration
        - Build / release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Mask credentials and internal hostnames.
      render: yaml
      placeholder: |
        knitid:
          default-type: UUID7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Include the error code (for example KNITID-2005) and stack trace.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      options:
        - label: Multi-instance deployment
        - label: Redis is used
        - label: ZooKeeper is used
        - label: Kubernetes is used
        - label: Docker is available for Testcontainers
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues
          required: true
        - label: This is not a security vulnerability
          required: true
