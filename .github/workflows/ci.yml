name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Spring Boot 4.1
            maven-args: ""
          - name: Spring Boot 4.0
            maven-args: "-Pboot-4.0"
    env:
      KNITID_TEST_REDIS_IMAGE: redis:8.10.3
      KNITID_TEST_ZOOKEEPER_IMAGE: zookeeper:3.9.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify ${{ matrix.name }}
        run: mvn -B -ntp ${{ matrix.maven-args }} verify
