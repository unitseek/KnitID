name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KNITID_TEST_REDIS_IMAGE: redis:8.10.3
      KNITID_TEST_ZOOKEEPER_IMAGE: zookeeper:3.9.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
