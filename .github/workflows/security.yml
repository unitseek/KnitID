name: Security

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - name: Install OSV Scanner
        run: |
          curl -fsSL -o osv-scanner_linux_amd64 https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          curl -fsSL -o osv-scanner_SHA256SUMS https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
      - name: Scan dependencies
        run: ./osv-scanner_linux_amd64 scan source --sbom target/bom.json --format table
