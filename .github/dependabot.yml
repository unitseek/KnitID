version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.sonatype.central*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
